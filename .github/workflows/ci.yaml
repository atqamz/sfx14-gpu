name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check
        run: bash -n bin/sfx14-gpu test/*.sh

      - name: ShellCheck
        run: shellcheck -x bin/sfx14-gpu test/*.sh

      - name: Tests
        run: test/run.sh
